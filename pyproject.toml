[build-system]
requires = ["scikit-build-core", "numpy"]
build-backend = "scikit_build_core.build"

[project]
name = "rabe"
authors = [{name = "Georg Grassler", email = "georg.grassler@tugraz.at"}]
description = "Asymptotic bootstrap current expressions for near omnigenous stellarators"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy", "f90wrap>=0.3.0"]
dynamic = ["version"]

[tool.scikit-build]
build.requires = ["f90wrap>=0.3.0"]
cmake.args = ["-DBUILD_PYTHON_BINDINGS=ON"]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"

[[tool.scikit-build.overrides]]
if.env.FC = "flang"
build.requires = ["f90wrap @ git+https://github.com/krystophny/f90wrap.git@fix-issue-378-flang-handle-size"]

[tool.setuptools_scm]
version_scheme = "python-simplified-semver"
local_scheme = "dirty-tag"
