name: Golden Record

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  workflow_dispatch:
    inputs:
      libneo_ref:
        description: libneo branch, tag or commit to build against
        required: false
        type: string
        default: ''
      fortio_ref:
        description: fortio branch, tag or commit to build against
        required: false
        type: string
        default: ''

jobs:
  golden:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v6

    - uses: cachix/install-nix-action@v31.10.6
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes

    - name: Show pinned toolchain
      run: |
        nix develop .#default --command bash -c '
          set -e
          uname -m
          gfortran --version | head -1
          ldd --version | head -1
          cmake --version | head -1
          make --version | head -1
          python --version
        '

    - name: Build project
      env:
        FORTIO_REF: ${{ inputs.fortio_ref }}
        LIBNEO_REF: ${{ inputs.libneo_ref }}
      run: |
        args=()
        if [ -n "$FORTIO_REF" ]; then
          args+=("FORTIO_REF=$FORTIO_REF")
        fi
        if [ -n "$LIBNEO_REF" ]; then
          args+=("LIBNEO_REF=$LIBNEO_REF")
        fi
        nix develop .#default --command make "${args[@]}"

    - name: Run golden record test
      run: nix develop .#default --command make golden
